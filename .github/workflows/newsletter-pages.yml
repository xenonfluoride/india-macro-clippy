name: Deploy India Macro Clippy

on:
  push:
    branches: [main]
    paths:
      - "outputs/**"
      - ".github/workflows/newsletter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: india-macro-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published issue
        uses: actions/checkout@v6

      - name: Assemble the Pages artifact
        shell: bash
        run: |
          mkdir -p site
          cp outputs/india-macro-clippy.html site/index.html
          cp outputs/india-macro-clippy-data.json site/india-macro-clippy-data.json
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
